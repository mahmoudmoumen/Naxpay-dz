workflows:
  nexarace-diagnose:
    name: NexaRace Diagnose
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Extract ZIP
        script: |
          set -e

          echo "===== START ====="

          ZIP_FILE="NexaPay_DZ_CODEMAGIC_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP FILE NOT FOUND"
            echo "Expected file: $ZIP_FILE"
            echo ""
            echo "Files found:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo "ZIP extracted successfully."


      - name: Find Gradle Project
        script: |
          set -e

          echo "===== SEARCHING FOR GRADLE PROJECT ====="

          GRADLEW=$(find "$CM_BUILD_DIR/extracted" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew NOT FOUND"
            echo ""
            echo "ZIP CONTENTS:"
            find "$CM_BUILD_DIR/extracted" \
              -maxdepth 7 \
              -type f \
              -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"


      - name: Show Build Gradle Lines
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "========================================"
          echo "       ANDROID BUILD.GRADLE"
          echo "========================================"

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then

            echo "FILE FOUND:"
            echo "$PROJECT_DIR/app/build.gradle"

            echo ""
            echo "========== LINES 1 - 100 =========="

            nl -ba "$PROJECT_DIR/app/build.gradle" | sed -n '1,100p'

          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            echo "FILE FOUND:"
            echo "$PROJECT_DIR/app/build.gradle.kts"

            echo ""
            echo "========== LINES 1 - 100 =========="

            nl -ba "$PROJECT_DIR/app/build.gradle.kts" | sed -n '1,100p'

          else

            echo "ERROR: app/build.gradle NOT FOUND"

            echo ""
            echo "PROJECT FILES:"
            find "$PROJECT_DIR" -maxdepth 4 -type f -print

            exit 1

          fi


      - name: Show Root Gradle Files
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "========================================"
          echo "          ROOT GRADLE FILES"
          echo "========================================"

          if [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "===== build.gradle ====="
            nl -ba "$PROJECT_DIR/build.gradle" | sed -n '1,100p'
          fi

          if [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "===== build.gradle.kts ====="
            nl -ba "$PROJECT_DIR/build.gradle.kts" | sed -n '1,100p'
          fi

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "===== settings.gradle ====="
            nl -ba "$PROJECT_DIR/settings.gradle" | sed -n '1,100p'
          fi

          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "===== settings.gradle.kts ====="
            nl -ba "$PROJECT_DIR/settings.gradle.kts" | sed -n '1,100p'
          fi


      - name: Show Android Manifest
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "========================================"
          echo "          ANDROID MANIFEST"
          echo "========================================"

          if [ -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then

            nl -ba "$PROJECT_DIR/app/src/main/AndroidManifest.xml" \
              | sed -n '1,150p'

          else

            echo "AndroidManifest.xml not found."

          fi


      - name: Show Project Structure
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "========================================"
          echo "          PROJECT STRUCTURE"
          echo "========================================"

          cd "$PROJECT_DIR"

          find . -maxdepth 4 -type f -print | sort


    artifacts:
      - "**/*.log"
