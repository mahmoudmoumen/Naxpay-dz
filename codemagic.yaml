workflows:
  nexarace-release:
    name: NexaRace Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17
      node: 20

      android_signing:
        - nexapay_release

    scripts:

      - name: Extract NexaPay ZIP
        script: |
          set -e

          echo "======================================"
          echo "       EXTRACTING NEXAPAY ZIP"
          echo "======================================"

          ZIP_FILE="NexaPay_DZ_CODEMAGIC_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo "ZIP extracted successfully."


      - name: Find Android Project
        script: |
          set -e

          echo "======================================"
          echo "       FINDING ANDROID PROJECT"
          echo "======================================"

          if [ ! -f "$CM_BUILD_DIR/extracted/android/gradlew" ]; then
            echo "ERROR: android/gradlew not found."
            find "$CM_BUILD_DIR/extracted" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$CM_BUILD_DIR/extracted/android"

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Android project:"
          echo "$PROJECT_DIR"


      - name: Fix Android build.gradle
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          echo "======================================"
          echo "       FIXING BUILD.GRADLE"
          echo "======================================"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          echo "Original build.gradle:"
          nl -ba "$BUILD_FILE" | sed -n '1,40p'

          python3 - "$BUILD_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          old_code = """        versionCode (project.findProperty('versionCode') ?: '1').toInteger()
          versionName (project.findProperty('versionName') ?: '1.0.0')"""

          new_code = """        versionCode 1
          versionName "1.0.0" """

          if old_code in text:
              text = text.replace(old_code, new_code)
              print("Fixed versionCode/versionName configuration.")
          else:
              print("Dynamic version configuration not found.")
              print("Keeping existing build.gradle.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo ""
          echo "Updated build.gradle:"
          nl -ba "$BUILD_FILE" | sed -n '1,40p'


      - name: Prepare Web Assets
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")
          WEB_DIR="$CM_BUILD_DIR/extracted/www"

          echo "======================================"
          echo "          PREPARING WEB ASSETS"
          echo "======================================"

          if [ -d "$WEB_DIR" ]; then

            rm -rf "$PROJECT_DIR/app/src/main/assets"

            mkdir -p "$PROJECT_DIR/app/src/main/assets/public"

            cp -R "$WEB_DIR"/. \
              "$PROJECT_DIR/app/src/main/assets/public/"

            echo "Web assets copied successfully."

          else

            echo "WARNING: www directory not found."

          fi


      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "======================================"
          echo "        CONFIGURING ANDROID SDK"
          echo "======================================"

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          cat "$PROJECT_DIR/local.properties"


      - name: Verify Android Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "       VERIFYING ANDROID PROJECT"
          echo "======================================"

          test -f gradlew
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "All required Android files found."

          echo ""
          echo "Gradle version:"
          ./gradlew --version


      - name: Clean Gradle
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "            GRADLE CLEAN"
          echo "======================================"

          ./gradlew clean --no-daemon --stacktrace


      - name: Build Release APK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "          BUILDING RELEASE APK"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease


      - name: Build Release AAB
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "          BUILDING RELEASE AAB"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            bundleRelease


      - name: Collect Artifacts
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "======================================"
          echo "          COLLECTING FILES"
          echo "======================================"

          mkdir -p "$CM_BUILD_DIR/final"

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          if [ -f "$APK" ]; then
            cp "$APK" "$CM_BUILD_DIR/final/NexaRace-release.apk"
            echo "APK found."
          else
            echo "ERROR: APK not found."
            exit 1
          fi

          if [ -f "$AAB" ]; then
            cp "$AAB" "$CM_BUILD_DIR/final/NexaRace-release.aab"
            echo "AAB found."
          else
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo ""
          echo "FINAL FILES:"
          ls -lh "$CM_BUILD_DIR/final"


    artifacts:
      - final/NexaRace-release.apk
      - final/NexaRace-release.aab
