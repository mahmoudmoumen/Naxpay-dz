workflows:
  nexarace-release:
    name: NexaRace Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

      android_signing:
        - nexapay_release

    scripts:

      # ==========================================
      # 1. Extract ZIP
      # ==========================================
      - name: Extract ZIP
        script: |
          set -e

          ZIP_FILE="NexaPay_DZ_CODEMAGIC_FIXED.zip"

          echo "========================================"
          echo "SEARCHING FOR GAME ZIP"
          echo "========================================"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP NOT FOUND"
            echo "Expected file:"
            echo "$ZIP_FILE"
            echo ""
            echo "Files found:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo ""
          echo "ZIP EXTRACTED SUCCESSFULLY"

          echo ""
          echo "Extracted project:"
          find "$CM_BUILD_DIR/extracted" \
            -maxdepth 5 \
            -type f \
            | sort


      # ==========================================
      # 2. Prepare Android Project
      # ==========================================
      - name: Prepare Android Project
        script: |
          set -e

          PROJECT_DIR="$CM_BUILD_DIR/extracted/android"

          echo "========================================"
          echo "PREPARING ANDROID PROJECT"
          echo "========================================"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: android directory not found"

            find "$CM_BUILD_DIR/extracted" \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew NOT FOUND"

            echo ""
            echo "Searching for gradlew:"
            find "$CM_BUILD_DIR/extracted" \
              -maxdepth 10 \
              -type f \
              -name "gradlew" \
              | sort

            exit 1
          fi

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Gradle wrapper:"
          ls -la "$PROJECT_DIR/gradlew"

          echo ""
          echo "Android project files:"
          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "gradlew" \
              -o -name "build.gradle" \
              -o -name "settings.gradle" \
              -o -name "gradle-wrapper.properties" \
            \) \
            | sort


      # ==========================================
      # 3. Create Clean app/build.gradle
      # ==========================================
      - name: Replace Android build.gradle
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "========================================"
          echo "CREATING CLEAN APP BUILD FILE"
          echo "========================================"

          cat > "$PROJECT_DIR/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.nexapay.dz'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.nexapay.dz'
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName '1.0.0'
              }

              buildTypes {
                  debug {
                      applicationIdSuffix '.debug'
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          echo ""
          echo "===== app/build.gradle ====="

          nl -ba "$PROJECT_DIR/app/build.gradle"


      # ==========================================
      # 4. Configure Android SDK
      # ==========================================
      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "========================================"
          echo "CONFIGURING ANDROID SDK"
          echo "========================================"

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo ""
          cat "$PROJECT_DIR/local.properties"


      # ==========================================
      # 5. Check Gradle
      # ==========================================
      - name: Check Gradle Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version

          echo ""
          echo "========================================"
          echo "CHECKING PROJECT"
          echo "========================================"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 6. Clean
      # ==========================================
      - name: Clean Gradle
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CLEAN GRADLE"
          echo "========================================"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 7. BUILD RELEASE APK
      # ==========================================
      - name: Build Release APK
        script: |
          set +e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          LOG_FILE="$CM_BUILD_DIR/gradle-apk.log"

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo ""
          echo "########################################"
          echo "######## ACTUAL GRADLE ERROR ###########"
          echo "########################################"

          grep -n -E \
            "What went wrong:|Could not |A problem occurred|Caused by:|error:|FAILURE:|Execution failed for task|Manifest merger failed|Duplicate class|Resource .* not found|uses-sdk|Signing" \
            "$LOG_FILE" \
            | tail -100 || true

          echo ""
          echo "########################################"
          echo "######## ERROR CONTEXT #################"
          echo "########################################"

          grep -n -B 8 -A 15 \
            -E "What went wrong:|Execution failed for task|A problem occurred|FAILURE:" \
            "$LOG_FILE" \
            | tail -180 || true

          echo ""
          echo "########################################"
          echo "######## BUILD RESULT ##################"
          echo "########################################"

          echo "Gradle exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "APK BUILD FAILED"
            echo "========================================"

            exit "$BUILD_EXIT"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          echo ""
          echo "Generated APK files:"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print


      # ==========================================
      # 8. BUILD RELEASE AAB
      # ==========================================
      - name: Build Release AAB
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING RELEASE AAB"
          echo "========================================"

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "AAB BUILD SUCCESS"
          echo "========================================"

          echo ""
          echo "Generated AAB files:"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            -print


    # ==========================================
    # OUTPUT FILES
    # ==========================================
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/bundle/release/*.aab"
