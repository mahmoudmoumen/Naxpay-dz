workflows:
  nexarace-release:
    name: NexaRace Release - Final Diagnostic
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

      android_signing:
        - nexapay_release

    scripts:

      # ==========================================
      # 1. Extract ZIP
      # ==========================================
      - name: Extract NexaRace
        script: |
          set -e

          ZIP_FILE="NexaRace_FINAL_ANDROID_CODMATIC_READY.zip"

          echo "========================================"
          echo "SEARCHING FOR ZIP"
          echo "========================================"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found:"
            echo "$ZIP_FILE"
            echo ""
            echo "AVAILABLE FILES:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"

          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$CM_BUILD_DIR/extracted"

          echo ""
          echo "========================================"
          echo "ZIP EXTRACTED"
          echo "========================================"

          find "$CM_BUILD_DIR/extracted" \
            -maxdepth 5 \
            -type f | sort


      # ==========================================
      # 2. Find Gradle Project
      # ==========================================
      - name: Find Android Project
        script: |
          set -e

          echo "========================================"
          echo "FINDING ANDROID PROJECT"
          echo "========================================"

          GRADLEW=$(find "$CM_BUILD_DIR/extracted" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew NOT FOUND"

            find "$CM_BUILD_DIR/extracted" \
              -maxdepth 12 \
              -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "$PROJECT_DIR" \
            > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo ""
          echo "PROJECT FILES:"
          find "$PROJECT_DIR" \
            -maxdepth 3 \
            -type f | sort


      # ==========================================
      # 3. Configure Android SDK
      # ==========================================
      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "========================================"
          echo "CONFIGURING ANDROID SDK"
          echo "========================================"

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo ""
          echo "SDK:"
          cat "$PROJECT_DIR/local.properties"


      # ==========================================
      # 4. Check Java
      # ==========================================
      - name: Check Java
        script: |
          set -e

          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"

          java -version


      # ==========================================
      # 5. Check Gradle
      # ==========================================
      - name: Check Gradle
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew \
            --version \
            --no-daemon


      # ==========================================
      # 6. Validate Gradle
      # ==========================================
      - name: Validate Gradle Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VALIDATING GRADLE PROJECT"
          echo "========================================"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==========================================
      # 7. Clean
      # ==========================================
      - name: Clean Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CLEAN PROJECT"
          echo "========================================"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==========================================
      # 8. Build Release APK
      # ==========================================
      - name: Build Release APK - FINAL DIAGNOSTIC
        script: |
          set +e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          LOG_FILE="$CM_BUILD_DIR/full-build.log"

          echo "========================================"
          echo "BUILDING NEXARACE RELEASE APK"
          echo "========================================"

          echo ""
          echo "PROJECT:"
          echo "$PROJECT_DIR"

          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "STARTING GRADLE..."
          echo ""

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "GRADLE EXIT CODE"
          echo "========================================"

          echo "$BUILD_EXIT"

          echo ""
          echo "========================================"
          echo "REAL GRADLE ERROR"
          echo "========================================"

          grep -n -E \
            "FAILURE:|What went wrong:|Execution failed for task|Could not resolve|Could not find|AAPT2|Manifest merger failed|Duplicate|error:|Error:|Caused by:|resource .* not found|uses-sdk|minSdk|targetSdk|compileSdk" \
            "$LOG_FILE" \
            | tail -n 150 || true

          echo ""
          echo "========================================"
          echo "LAST 150 LOG LINES"
          echo "========================================"

          tail -n 150 "$LOG_FILE"

          echo ""
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print || true

          echo ""
          echo "========================================"
          echo "SEARCHING FOR ALL APK FILES"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print || true

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "APK BUILD FAILED"
            echo "========================================"

            exit "$BUILD_EXIT"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"


    # ==========================================
    # 9. Artifacts
    # ==========================================
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "$CM_BUILD_DIR/full-build.log"
