workflows:
  nexarace-release:
    name: NexaRace Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

      android_signing:
        - nexapay_release

    scripts:

      - name: Extract ZIP
        script: |
          set -e

          ZIP_FILE="NexaPay_DZ_CODEMAGIC_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo "ZIP extracted successfully."


      - name: Prepare Android Project
        script: |
          set -e

          PROJECT_DIR="$CM_BUILD_DIR/extracted/android"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            find "$CM_BUILD_DIR/extracted" \
              -maxdepth 10 \
              -type f \
              -name "gradlew" \
              | sort
            exit 1
          fi

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Android project:"
          echo "$PROJECT_DIR"


      - name: Configure Android Build
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cat > "$PROJECT_DIR/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.nexapay.dz'

              compileSdk 36

              defaultConfig {
                  applicationId 'com.nexapay.dz'
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName '1.0.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildTypes {
                  debug {
                      applicationIdSuffix '.debug'
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false

                      proguardFiles \
                          getDefaultProguardFile('proguard-android-optimize.txt'), \
                          'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          echo "===== FINAL BUILD.GRADLE ====="
          cat "$PROJECT_DIR/app/build.gradle"


      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"


      - name: Check Gradle Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          ./gradlew --version

          ./gradlew tasks \
            --no-daemon \
            --stacktrace


      - name: Clean Gradle
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      - name: Build Release APK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print


      - name: Build Release AAB
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING RELEASE AAB"
          echo "========================================"

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "AAB BUILD SUCCESS"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            -print


    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/bundle/release/*.aab"
