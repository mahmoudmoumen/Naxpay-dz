workflows:
  racing-game-android:
    name: Racing Game Android

    environment:
      java: 21

    scripts:

      - name: Extract NexaRace project
        script: |
          set -e

          echo "=== Repository ==="
          pwd
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          echo "=== Extracting ZIP ==="
          unzip -o "$ZIP_FILE" -d extracted

          echo "=== Searching project files ==="
          find extracted -maxdepth 6 -type f | sort

      - name: Find Gradle Wrapper
        script: |
          set -e

          echo "=== Searching for gradlew ==="

          GRADLEW=$(find ./extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          echo "gradlew found:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "=== Project root ==="
          ls -lah "$PROJECT_DIR"

      - name: Build Release APK
        script: |
          set -e

          GRADLEW=$(find ./extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "================================"
          echo "JAVA VERSION"
          echo "================================"
          java -version

          echo "================================"
          echo "GRADLE VERSION"
          echo "================================"
          ./gradlew --version

          echo "================================"
          echo "AVAILABLE GRADLE TASKS"
          echo "================================"
          ./gradlew tasks --all

          echo "================================"
          echo "BUILDING RELEASE APK"
          echo "================================"

          ./gradlew assembleRelease

      - name: Find generated APK
        script: |
          echo "================================"
          echo "GENERATED APK FILES"
          echo "================================"

          find ./extracted -type f \( -name "*.apk" -o -name "*.aab" \) -print

    artifacts:
      - "extracted/**/*.apk"
      - "extracted/**/*.aab"
