workflows:
  nexarace-release:
    name: NexaRace Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

      android_signing:
        - nexapay_release

    scripts:

      # ==========================================
      # 1. Extract NexaRace ZIP
      # ==========================================
      - name: Extract NexaRace
        script: |
          set -e

          ZIP_FILE="NexaRace_FINAL_ANDROID_CODMATIC_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found: $ZIP_FILE"
            echo ""
            echo "Files available in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo ""
          echo "========================================"
          echo "ZIP EXTRACTED SUCCESSFULLY"
          echo "========================================"

          find "$CM_BUILD_DIR/extracted" \
            -maxdepth 8 \
            -type f \
            \( -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print


      # ==========================================
      # 2. Find Android Project
      # ==========================================
      - name: Find Android Project
        script: |
          set -e

          echo "Searching for Gradle wrapper..."

          GRADLEW=$(find "$CM_BUILD_DIR/extracted" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew was not found anywhere in the ZIP."
            echo ""
            echo "ZIP CONTENT:"
            find "$CM_BUILD_DIR/extracted" \
              -maxdepth 10 \
              -type f \
              | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT FOUND"
          echo "========================================"
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo ""
          echo "Gradle wrapper:"
          echo "$PROJECT_DIR/gradlew"


      # ==========================================
      # 3. Check Android Project
      # ==========================================
      - name: Check Android Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT FILES"
          echo "========================================"

          ls -la

          echo ""
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version


      # ==========================================
      # 4. Configure Android SDK
      # ==========================================
      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo "Android SDK configured."


      # ==========================================
      # 5. Validate Gradle Project
      # ==========================================
      - name: Validate Gradle Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "VALIDATING GRADLE PROJECT"
          echo "========================================"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 6. Clean Project
      # ==========================================
      - name: Clean Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "CLEANING PROJECT"
          echo "========================================"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 7. Build Release APK
      # ==========================================
      - name: Build Release APK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "BUILDING NEXARACE RELEASE APK"
          echo "========================================"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print


      # ==========================================
      # 8. Build Release AAB
      # ==========================================
      - name: Build Release AAB
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "BUILDING NEXARACE RELEASE AAB"
          echo "========================================"

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "AAB BUILD SUCCESS"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            -print


    # ==========================================
    # 9. Artifacts
    # ==========================================
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/bundle/release/*.aab"
