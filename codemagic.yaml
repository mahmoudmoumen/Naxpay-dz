workflows:
  nexapay_android:
    name: NexaPay Android

    environment:
      node: 20
      java: 17

    scripts:
      - name: Inspect build.gradle
        script: |
          set -e

          echo "===== FIND ZIP ====="

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "NexaPay_DZ_CODEMAGIC_FIXED.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"

          echo "===== EXTRACT ZIP ====="

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          cd extracted

          echo "===== INSTALL CAPACITOR ====="

          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo "===== CAPACITOR SYNC ====="

          npx cap sync android

          echo ""
          echo "========================================"
          echo " BUILD.GRADLE LINES 1 TO 25"
          echo "========================================"

          nl -ba android/app/build.gradle | sed -n '1,25p'

          echo ""
          echo "========================================"
          echo " LINE 14 ONLY"
          echo "========================================"

          sed -n '14p' android/app/build.gradle

          echo ""
          echo "========================================"
          echo " END OF DIAGNOSTIC"
          echo "========================================"

          exit 1
