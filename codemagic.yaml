workflows:
  android-build:
    name: NexaPay DZ Android Build
    max_build_duration: 60

    environment:
      flutter: stable
      groups:
        - nexapay_credentials

    scripts:
      - name: Check project files
        script: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files ==="
          ls -la
          
          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json not found"
            echo "Searching for package.json..."
            find . -name package.json -not -path "*/node_modules/*" -print
          fi

      - name: Install dependencies
        script: |
          if [ -f package.json ]; then
            npm install
          else
            echo "ERROR: package.json not found in project root"
            exit 1
          fi

      - name: Prepare Capacitor Android
        script: |
          if [ ! -d "node_modules" ]; then
            echo "Installing npm dependencies..."
            npm install
          fi

          if [ ! -d "android" ]; then
            echo "Android folder not found."
            echo "Preparing Capacitor Android..."
            npx cap add android
          fi

          npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
