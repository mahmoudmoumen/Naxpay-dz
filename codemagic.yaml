
workflows:
  nexapay-android:
    name: Android App Bundle (Google Play)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Copy Web Assets
        script: |
          mkdir -p android/app/src/main/assets
          cp -R ./* android/app/src/main/assets/ || true

      - name: Build Android App Bundle
        script: |
          # البحث عن مجلد gradlew والدخول إليه تلقائيًا
          GRADLE_DIR=$(dirname $(find . -name "gradlew" -print -quit))
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew --stacktrace bundleRelease
          else
            echo "Error: gradlew file not found in repository!"
            exit 1
          fi

    artifacts:
      - "**/build/outputs/bundle/release/*.aab"
