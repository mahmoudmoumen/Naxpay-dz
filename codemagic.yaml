workflows:
  nexarace-android:
    name: NexaRace Android Build

    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.nexarace.app"
      java: 17

    scripts:
      - name: Check project structure
        script: |
          echo "=== Current directory ==="
          pwd

          echo "=== Files ==="
          ls -la

          echo "=== Search for gradlew ==="
          find . -maxdepth 3 -name "gradlew" -type f -print

      - name: Locate Gradle Wrapper
        script: |
          if [ -f "./gradlew" ]; then
            echo "gradlew found in project root."
          elif [ -f "./NexaRace/gradlew" ]; then
            echo "gradlew found inside NexaRace folder."
            cd NexaRace
          else
            echo "ERROR: gradlew was not found."
            echo "The project ZIP must contain gradlew."
            exit 1
          fi

      - name: Make Gradle executable
        script: |
          chmod +x ./gradlew

      - name: Verify Gradle Wrapper
        script: |
          ./gradlew --version

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Release APK
        script: |
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/release/*.aab

    publishing:
      email:
        recipients:
          - "harfhalp@gmail.com"
        notify:
          success: true
          failure: true
