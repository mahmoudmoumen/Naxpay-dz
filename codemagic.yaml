workflows:
  nexapay_android:
    name: NexaPay Android

    environment:
      node: 20
      java: 17

    scripts:
      - name: Build NexaPay Android
        script: |
          set -e

          echo "===== FIND ZIP ====="

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "NexaPay_DZ_CODEMAGIC_FIXED.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"

          echo "===== EXTRACT ZIP ====="

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          cd extracted

          echo "===== INSTALL CAPACITOR ====="

          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo "===== CAPACITOR VERSION ====="

          npx cap --version

          echo "===== CAPACITOR SYNC ====="

          npx cap sync android

          echo "===== BUILD.GRADLE AROUND LINE 14 ====="

          echo "LINE 10:"
          sed -n '10p' android/app/build.gradle

          echo "LINE 11:"
          sed -n '11p' android/app/build.gradle

          echo "LINE 12:"
          sed -n '12p' android/app/build.gradle

          echo "LINE 13:"
          sed -n '13p' android/app/build.gradle

          echo "LINE 14:"
          sed -n '14p' android/app/build.gradle

          echo "LINE 15:"
          sed -n '15p' android/app/build.gradle

          echo "LINE 16:"
          sed -n '16p' android/app/build.gradle

          echo "LINE 17:"
          sed -n '17p' android/app/build.gradle

          echo "===== END CHECK ====="

          echo "===== BUILD APK ====="

          cd android

          chmod +x gradlew

          ./gradlew assembleRelease

          echo "===== APK CREATED ====="

          find app/build/outputs -type f -name "*.apk" -print

    artifacts:
      - "extracted/android/app/build/outputs/**/*.apk"
