workflows:
  racing-game-android:
    name: Racing Game Android
    max_build_duration: 60

    environment:
      java: 21
      android_signing:
        - nexapay_release

    scripts:

      - name: Show Environment
        script: |
          echo "===== CURRENT DIRECTORY ====="
          pwd
          echo "===== ROOT FILES ====="
          ls -la

      - name: Find Android Project
        script: |
          echo "===== SEARCHING FOR GRADLE PROJECT ====="

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="$(pwd)"
          elif [ -f "./android/gradlew" ]; then
            PROJECT_DIR="$(pwd)/android"
          else
            echo "ERROR: gradlew was not found"
            echo "Searching entire repository..."
            find . -name "gradlew" -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Check Gradle Files
        script: |
          if [ -f "./gradlew" ]; then
            PROJECT_DIR="$(pwd)"
          elif [ -f "./android/gradlew" ]; then
            PROJECT_DIR="$(pwd)/android"
          else
            echo "ERROR: gradlew was not found"
            find . -name "gradlew" -type f -print
            exit 1
          fi

          echo "===== PROJECT ====="
          echo "$PROJECT_DIR"

          echo "===== FILES ====="
          ls -la "$PROJECT_DIR"

          echo "===== GRADLE FILES ====="
          test -f "$PROJECT_DIR/gradlew" && echo "gradlew: OK"
          test -f "$PROJECT_DIR/build.gradle" && echo "build.gradle: OK"
          test -f "$PROJECT_DIR/settings.gradle" && echo "settings.gradle: OK"
          test -d "$PROJECT_DIR/gradle/wrapper" && echo "Gradle wrapper: OK"

      - name: Make Gradle Executable
        script: |
          echo "===== MAKING GRADLE EXECUTABLE ====="

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="$(pwd)"
          elif [ -f "./android/gradlew" ]; then
            PROJECT_DIR="$(pwd)/android"
          else
            echo "ERROR: gradlew was not found"
            echo "===== SEARCH RESULTS ====="
            find . -name "gradlew" -type f -print
            exit 1
          fi

          echo "Using Gradle wrapper:"
          echo "$PROJECT_DIR/gradlew"

          chmod +x "$PROJECT_DIR/gradlew"

          if [ ! -x "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew could not be made executable"
            exit 1
          fi

          echo "SUCCESS: gradlew is executable"

      - name: Check Gradle
        script: |
          if [ -f "./gradlew" ]; then
            PROJECT_DIR="$(pwd)"
          elif [ -f "./android/gradlew" ]; then
            PROJECT_DIR="$(pwd)/android"
          else
            echo "ERROR: gradlew was not found"
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "===== GRADLE VERSION ====="
          ./gradlew --version

      - name: Clean Project
        script: |
          if [ -f "./gradlew" ]; then
            PROJECT_DIR="$(pwd)"
          elif [ -f "./android/gradlew" ]; then
            PROJECT_DIR="$(pwd)/android"
          else
            echo "ERROR: gradlew was not found"
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "===== CLEAN PROJECT ====="
          ./gradlew clean

      - name: Build Release APK
        script: |
          if [ -f "./gradlew" ]; then
            PROJECT_DIR="$(pwd)"
          elif [ -f "./android/gradlew" ]; then
            PROJECT_DIR="$(pwd)/android"
          else
            echo "ERROR: gradlew was not found"
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "===== BUILD RELEASE APK ====="
          ./gradlew assembleRelease --stacktrace

    artifacts:
      - "**/build/outputs/apk/**/*.apk"
      - "**/build/outputs/apk/**/*.aab"
