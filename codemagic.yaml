workflows:
  android-workflow:
    name: NexaPay DZ Android
    instance_type: linux

    environment:
      java: 17

    scripts:
      - name: Extract NexaPay project
        script: |
          set -e

          echo "===== Searching for ZIP ====="
          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "===== Searching for package.json ====="
          PACKAGE=$(find extracted -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found inside ZIP"
            echo "===== ZIP CONTENTS ====="
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== Installing dependencies ====="
          npm install

          echo "===== Preparing Capacitor Android ====="
          npx cap sync android

          echo "===== Building Android APK ====="
          cd android

          chmod +x gradlew

          ./gradlew assembleRelease

    artifacts:
      - extracted/**/android/app/build/outputs/apk/release/*.apk
      - extracted/**/android/app/build/outputs/apk/release/*.aab
