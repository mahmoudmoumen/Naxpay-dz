workflows:
  racing-game-android:
    name: Racing Game Android

    environment:
      java: 21

    scripts:

      - name: Extract NexaRace project
        script: |
          set -e

          echo "=== Repository files ==="
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "=== Extracted project ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Find Gradle Wrapper
        script: |
          set -e

          echo "=== Searching for gradlew ==="

          GRADLEW=$(find ./extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          echo "gradlew found at:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Build Release APK
        script: |
          set -e

          GRADLEW=$(find ./extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "=== Java version ==="
          java -version

          echo "=== Gradle version ==="
          ./gradlew --version

          echo "=== Cleaning ==="
          ./gradlew clean

          echo "=== Building Release APK ==="
          ./gradlew assembleRelease

      - name: Locate APK
        script: |
          echo "=== Generated APK files ==="
          find ./extracted -type f -name "*.apk" -print

    artifacts:
      - "extracted/**/*.apk"
      - "extracted/**/*.aab"
