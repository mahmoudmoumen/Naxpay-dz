
workflows:
  nexapay-android:
    name: NexaPay DZ Android
    max_build_duration: 60

    environment:
      node: 20
      java: 17

    scripts:
      - name: Find project and Prepare Capacitor Android
        script: |
          set -e

          echo "===== Searching for package.json ====="

          PACKAGE_JSON=$(find . -name package.json -not -path "*/node_modules/*" -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found anywhere in repository"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "Found package.json: $PACKAGE_JSON"
          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "===== Installing dependencies ====="
          npm install

          echo "===== Checking Capacitor ====="
          npx cap --version

          echo "===== Preparing Android ====="
          npx cap sync android

      - name: Build Android APK
        script: |
          set -e

          PACKAGE_JSON=$(find . -name package.json -not -path "*/node_modules/*" -print -quit)
          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - "**/android/app/build/outputs/**/*.apk"
      - "**/android/app/build/outputs/**/*.aab"
