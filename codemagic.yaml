
workflows:
  android-build:
    name: NaxaAdmin Android Build
    max_build_duration: 30

    environment:
      java: 21

    scripts:
      - name: Extract Android project
        script: |
          mkdir -p extracted
          unzip -q NaxaAdmin_Android_Compatible_FIXED.zip -d extracted

      - name: Build APK
        script: |
          PROJECT_DIR=$(dirname "$(find "$CM_BUILD_DIR/extracted" -name settings.gradle -print -quit)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - "**/build/outputs/apk/**/*.apk"
