workflows:
  racing-game-android:
    name: Racing Game Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

      android_signing:
        - racing_release

    scripts:
      - name: Make Gradle executable
        script: |
          chmod +x gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Release APK
        script: |
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
