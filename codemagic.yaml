workflows:
  nexarace-release:
    name: NexaRace Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

      android_signing:
        - nexapay_release

    scripts:

      - name: Extract NexaRace V3
        script: |
          set -e

          ZIP_FILE="NexaRace_Complete_V3_Icon.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found: $ZIP_FILE"
            echo "Files available:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo "========================================"
          echo "ZIP EXTRACTED SUCCESSFULLY"
          echo "========================================"

          find "$CM_BUILD_DIR/extracted" -maxdepth 5 -type f \
            \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print


      - name: Find Android Project
        script: |
          set -e

          echo "Searching for Gradle wrapper..."

          GRADLEW=$(find "$CM_BUILD_DIR/extracted" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found anywhere in the ZIP."
            echo ""
            echo "ZIP CONTENT:"
            find "$CM_BUILD_DIR/extracted" -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "========================================"
          echo "ANDROID PROJECT FOUND"
          echo "========================================"
          echo "Project: $PROJECT_DIR"
          echo "Gradle:  $PROJECT_DIR/gradlew"


      - name: Check Android Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          ls -la

          echo ""
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version


      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo "Android SDK configured."


      - name: Validate Gradle Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VALIDATING GRADLE PROJECT"
          echo "========================================"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace


      - name: Clean Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CLEANING PROJECT"
          echo "========================================"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      - name: Build Release APK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING NEXARACE RELEASE APK"
          echo "========================================"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print


      - name: Build Release AAB
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING NEXARACE RELEASE AAB"
          echo "========================================"

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "AAB BUILD SUCCESS"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            -print


    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/bundle/release/*.aab"
