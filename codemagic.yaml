workflows:
  nexarace-release:
    name: NexaRace Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21

    scripts:

      - name: Extract Android ZIP
        script: |
          set -e

          echo "=== Repository files ==="
          find "$CM_BUILD_DIR" -maxdepth 2 -type f | sort

          ZIP_FILE="$CM_BUILD_DIR/NexaRace_FINAL_ANDROID_CODMATIC_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/android_project"
          mkdir -p "$CM_BUILD_DIR/android_project"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/android_project"

          echo "=== Extracted files ==="
          find "$CM_BUILD_DIR/android_project" -type f | sort

      - name: Find Android Project
        script: |
          set -e

          ROOT="$CM_BUILD_DIR/android_project"

          echo "=== Searching for Gradle project ==="

          GRADLEW=$(find "$ROOT" -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found."
            echo "Searching for build.gradle:"
            find "$ROOT" -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) -print

            echo "=== Complete extracted tree ==="
            find "$ROOT" -maxdepth 8 -type f | sort

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$GRADLEW"

      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR="$(cat "$CM_BUILD_DIR/project_dir.txt")"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          echo "SDK:"
          cat "$PROJECT_DIR/local.properties"

      - name: Check Gradle
        script: |
          set -e

          PROJECT_DIR="$(cat "$CM_BUILD_DIR/project_dir.txt")"

          cd "$PROJECT_DIR"

          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          ./gradlew --version --no-daemon

      - name: Clean Project
        script: |
          set -e

          PROJECT_DIR="$(cat "$CM_BUILD_DIR/project_dir.txt")"

          cd "$PROJECT_DIR"

          ./gradlew clean --no-daemon --stacktrace

      - name: Build Release APK
        script: |
          set -e

          PROJECT_DIR="$(cat "$CM_BUILD_DIR/project_dir.txt")"

          cd "$PROJECT_DIR"

          echo "=== Building APK ==="

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/apk/**/*.apk"
      - "**/build/outputs/**/*.aab"
