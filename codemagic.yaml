
workflows:
  nexarace-diagnose:
    name: NexaRace Diagnose
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

      android_signing:
        - nexapay_release

    scripts:

      - name: Extract ZIP
        script: |
          set -e

          echo "======================================"
          echo "          EXTRACTING ZIP"
          echo "======================================"

          ZIP_FILE="NexaPay_DZ_CODEMAGIC_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP NOT FOUND"
            echo "Expected:"
            echo "$ZIP_FILE"
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo "ZIP extracted successfully."


      - name: Find Android Project
        script: |
          set -e

          echo "======================================"
          echo "       SEARCHING ANDROID PROJECT"
          echo "======================================"

          GRADLEW=$(find "$CM_BUILD_DIR/extracted" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew NOT FOUND"
            echo ""
            echo "Files inside ZIP:"
            find "$CM_BUILD_DIR/extracted" -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"


      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "======================================"
          echo "        ANDROID SDK CONFIGURATION"
          echo "======================================"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          cat "$PROJECT_DIR/local.properties"


      - name: Show Project Files
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "          PROJECT FILES"
          echo "======================================"

          pwd

          echo ""

          find . -maxdepth 3 -type f | sort


      - name: Show Build Gradle
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "======================================"
          echo "       ANDROID BUILD.GRADLE"
          echo "======================================"

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then

            echo "FOUND:"
            echo "$PROJECT_DIR/app/build.gradle"

            echo ""
            echo "===== LINES 1 - 80 ====="

            nl -ba "$PROJECT_DIR/app/build.gradle" | sed -n '1,80p'

          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            echo "FOUND:"
            echo "$PROJECT_DIR/app/build.gradle.kts"

            echo ""
            echo "===== LINES 1 - 80 ====="

            nl -ba "$PROJECT_DIR/app/build.gradle.kts" | sed -n '1,80p'

          else

            echo "ERROR: app/build.gradle NOT FOUND"

          fi


      - name: Show Settings Gradle
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "======================================"
          echo "          SETTINGS GRADLE"
          echo "======================================"

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then

            nl -ba "$PROJECT_DIR/settings.gradle" | sed -n '1,80p'

          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then

            nl -ba "$PROJECT_DIR/settings.gradle.kts" | sed -n '1,80p'

          else

            echo "settings.gradle NOT FOUND"

          fi


      - name: Run Gradle Diagnostic
        script: |
          set +e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "       GRADLE DIAGNOSTIC"
          echo "======================================"

          echo ""
          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "======================================"
          echo "       RUNNING GRADLE CLEAN"
          echo "======================================"

          ./gradlew clean --stacktrace --info

          STATUS=$?

          echo ""
          echo "======================================"
          echo "       GRADLE EXIT CODE: $STATUS"
          echo "======================================"

          exit $STATUS


    artifacts:
      - "**/*.apk"
      - "**/*.aab"
