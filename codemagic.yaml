workflows:
  android-build:
    name: NexaPay DZ Android
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Find project root
        script: |
          set -e

          echo "===== SEARCHING FOR PACKAGE.JSON ====="

          PACKAGE=$(find . -type f -name "package.json" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found anywhere"
            exit 1
          fi

          echo "Found package.json: $PACKAGE"

          ROOT=$(dirname "$PACKAGE")
          cd "$ROOT"

          echo "Project root:"
          pwd

          echo "Project files:"
          ls -la

      - name: Install Node dependencies
        script: |
          set -e

          PACKAGE=$(find . -type f -name "package.json" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          ROOT=$(dirname "$PACKAGE")
          cd "$ROOT"

          echo "Installing dependencies in:"
          pwd

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Capacitor
        script: |
          set -e

          PACKAGE=$(find . -type f -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          ROOT=$(dirname "$PACKAGE")
          cd "$ROOT"

          echo "Installing Capacitor..."

          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo "===== CAPACITOR VERSION ====="
          npx cap --version

      - name: Prepare Capacitor Android
        script: |
          set -e

          PACKAGE=$(find . -type f -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          ROOT=$(dirname "$PACKAGE")
          cd "$ROOT"

          echo "===== CAPACITOR CHECK ====="

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          if [ ! -d node_modules/@capacitor/core ]; then
            echo "ERROR: Capacitor is not installed"
            exit 1
          fi

          npx cap --version

          echo "===== ANDROID CHECK ====="

          if [ ! -d android ]; then
            echo "Android folder does not exist."
            echo "Creating Android project..."
            npx cap add android
          fi

          echo "Capacitor Android is ready."

      - name: Build Android
        script: |
          set -e

          PACKAGE=$(find . -type f -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          ROOT=$(dirname "$PACKAGE")
          cd "$ROOT"

          npx cap sync android

          cd android

          chmod +x gradlew

          ./gradlew assembleRelease

    artifacts:
      - "**/app/build/outputs/**/*.apk"
      - "**/app/build/outputs/**/*.aab"
