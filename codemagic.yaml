workflows:
  nexarace-release:
    name: NexaRace Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 21

      android_signing:
        - nexapay_release

    scripts:

      - name: Extract Game ZIP
        script: |
          set -e

          ZIP_FILE="NexaPay_DZ_CODEMAGIC_FIXED.zip"

          echo "===== Checking ZIP ====="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo "ZIP extracted successfully."


      - name: Find Android Project
        script: |
          set -e

          echo "===== Searching for Gradle ====="

          GRADLEW=$(find "$CM_BUILD_DIR/extracted" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            find "$CM_BUILD_DIR/extracted" -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Project:"
          echo "$PROJECT_DIR"


      - name: Configure Android
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          echo "Android SDK configured."


      - name: Diagnose build.gradle
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "======================================"
          echo "       BUILD.GRADLE CHECK"
          echo "======================================"

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "File found:"
            echo "$PROJECT_DIR/app/build.gradle"
            echo ""
            echo "===== app/build.gradle ====="
            nl -ba "$PROJECT_DIR/app/build.gradle" | sed -n '1,100p'
          else
            echo "ERROR: app/build.gradle not found"
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi


      - name: Gradle Clean
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "===== Running Gradle Clean ====="

          ./gradlew clean --stacktrace


      - name: Build Release APK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "===== Building APK ====="

          ./gradlew assembleRelease --stacktrace


      - name: Build Release AAB
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "===== Building AAB ====="

          ./gradlew bundleRelease --stacktrace


    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/bundle/release/*.aab"
