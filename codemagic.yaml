workflows:
  racing-game-android:
    name: Racing Game Android
    max_build_duration: 60

    environment:
      java: 21

      android_signing:
        - racing_release

    scripts:

      - name: Show Environment
        script: |
          set -e

          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "JAVA HOME"
          echo "========================================"
          echo "$JAVA_HOME"

      - name: Find Android Project
        script: |
          set -e

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          find . -maxdepth 4 -type f \
            \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Check Gradle Files
        script: |
          set -e

          echo "========================================"
          echo "GRADLE FILES"
          echo "========================================"

          find . -maxdepth 5 -type f \
            \( -name "gradlew" -o -name "gradle-wrapper.jar" -o -name "gradle-wrapper.properties" \) \
            -print

      - name: Make Gradle Executable
        script: |
          set -e

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          echo "Found Gradle Wrapper:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

      - name: Check Gradle
        script: |
          set +e

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          "$GRADLEW" --version 2>&1 | tee gradle-version.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "LAST 50 LINES"
          echo "========================================"

          tail -n 50 gradle-version.log

          echo ""
          echo "Gradle exit code: $EXIT_CODE"

          exit $EXIT_CODE

      - name: Clean Project
        script: |
          set +e

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          chmod +x "$GRADLEW"

          "$GRADLEW" clean --stacktrace 2>&1 | tee clean.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "LAST 50 LINES OF CLEAN LOG"
          echo "========================================"

          tail -n 50 clean.log

          exit $EXIT_CODE

      - name: Build Release APK - FINAL DIAGNOSTIC
        script: |
          set +e

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          chmod +x "$GRADLEW"

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          "$GRADLEW" assembleRelease --stacktrace 2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "LAST 50 LINES OF BUILD LOG"
          echo "========================================"

          tail -n 50 build.log

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $EXIT_CODE"
          echo "========================================"

          exit $EXIT_CODE

    artifacts:
      - "**/build/outputs/apk/**/*.apk"
      - "**/build/outputs/apk/**/*.aab"
