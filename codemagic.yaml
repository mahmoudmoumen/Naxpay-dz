workflows:
  nexarace-release:
    name: NexaRace Release APK
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Check Android project
        script: |
          echo "===== ROOT ====="
          pwd
          ls -la

          echo "===== CHECK GRADLE ====="

          test -f gradlew || {
            echo "ERROR: gradlew not found in project root"
            exit 1
          }

          test -f settings.gradle || test -f settings.gradle.kts || {
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            exit 1
          }

          test -d app || {
            echo "ERROR: app directory not found"
            exit 1
          }

          chmod +x ./gradlew

      - name: Show Gradle projects
        script: |
          ./gradlew projects

      - name: Show Android tasks
        script: |
          ./gradlew :app:tasks --all

      - name: Build Release APK
        script: |
          ./gradlew :app:assembleRelease --stacktrace

    artifacts:
      - app/build/outputs/apk/release/*.apk
