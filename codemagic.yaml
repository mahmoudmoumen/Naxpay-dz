workflows:
  racing-game-android:
    name: Racing Game Android

    environment:
      java: 17

    scripts:

      - name: Find Gradle Wrapper
        script: |
          echo "=== Project structure ==="
          pwd
          find . -maxdepth 5 -type f | sort

          echo "=== Searching for gradlew ==="
          GRADLEW=$(find . -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found"
            exit 1
          fi

          echo "Found gradlew at:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

          GRADLE_DIR=$(dirname "$GRADLEW")
          echo "Gradle directory:"
          echo "$GRADLE_DIR"

          cd "$GRADLE_DIR"

          echo "=== Gradle version ==="
          ./gradlew --version

      - name: Build Release APK
        script: |
          GRADLEW=$(find . -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found"
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")
          cd "$GRADLE_DIR"

          chmod +x ./gradlew

          ./gradlew clean
          ./gradlew assembleRelease

    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "**/build/outputs/apk/release/*.aab"
