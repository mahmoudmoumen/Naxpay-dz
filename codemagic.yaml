workflows:
  racing-game-android:
    name: Racing Game Android

    environment:
      java: 17

    scripts:

      - name: Extract NexaRace project
        script: |
          set -e

          echo "=== Files in GitHub repository ==="
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          echo "=== Extracting ZIP ==="
          unzip -o "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Find Gradle Wrapper
        script: |
          set -e

          echo "=== Searching for gradlew ==="

          GRADLEW=$(find ./extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found after extracting ZIP."
            echo "The ZIP does not contain a usable Gradle Wrapper."
            exit 1
          fi

          echo "gradlew found:"
          echo "$GRADLEW"

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "=== Project files ==="
          ls -lah "$PROJECT_DIR"

      - name: Build Release APK
        script: |
          set -e

          GRADLEW=$(find ./extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

          echo "=== Cleaning project ==="
          ./gradlew clean

          echo "=== Building Release APK ==="
          ./gradlew assembleRelease

      - name: Locate APK
        script: |
          echo "=== APK files ==="
          find ./extracted -type f -name "*.apk" -print

    artifacts:
      - "extracted/**/*.apk"
      - "extracted/**/*.aab"
