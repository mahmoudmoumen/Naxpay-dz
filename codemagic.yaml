workflows:
  android-build:
    name: NexaPay DZ Android
    max_build_duration: 60

    environment:
      node: latest

    scripts:
      - name: Extract NexaPay project
        script: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -o NaxaAdmin_Android_Compatible_FIXED.zip -d extracted

          cd extracted

          echo "===== PROJECT FILES ====="
          ls -la

          test -f package.json
          test -d android

      - name: Install dependencies
        script: |
          set -e
          cd extracted
          npm install

      - name: Build Android APK
        script: |
          set -e
          cd extracted/android

          chmod +x gradlew

          ./gradlew assembleRelease --stacktrace

    artifacts:
      - extracted/android/app/build/outputs/**/*.apk
      - extracted/android/app/build/outputs/**/*.aab
