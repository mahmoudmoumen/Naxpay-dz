workflows:
  nexarace-release:
    name: NexaRace Release - Diagnostic
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 21

      android_signing:
        - nexapay_release

    scripts:

      - name: Extract NexaRace
        script: |
          set -e

          ZIP_FILE="NexaRace_FINAL_ANDROID_CODMATIC_READY.zip"

          echo "========================================"
          echo "SEARCHING FOR ZIP"
          echo "========================================"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found: $ZIP_FILE"
            echo ""
            echo "AVAILABLE FILES:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo ""
          echo "========================================"
          echo "ZIP EXTRACTED"
          echo "========================================"

          find "$CM_BUILD_DIR/extracted" \
            -type f \
            \( \
              -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print


      - name: Find Android Project
        script: |
          set -e

          echo "========================================"
          echo "FINDING GRADLE PROJECT"
          echo "========================================"

          GRADLEW=$(find "$CM_BUILD_DIR/extracted" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."

            find "$CM_BUILD_DIR/extracted" \
              -maxdepth 12 \
              -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo ""
          echo "PROJECT FILES:"
          find "$PROJECT_DIR" \
            -maxdepth 3 \
            -type f | sort


      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "========================================"
          echo "CONFIGURING ANDROID SDK"
          echo "========================================"

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDK configured successfully."


      - name: Check Android Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version \
            --no-daemon


      - name: Validate Gradle Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VALIDATING GRADLE PROJECT"
          echo "========================================"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace


      - name: Clean Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CLEANING PROJECT"
          echo "========================================"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      - name: Build Release APK - DIAGNOSTIC
        script: |
          set -u

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          cd "$PROJECT_DIR"

          LOG_FILE="$CM_BUILD_DIR/assemble-release.log"

          echo "========================================"
          echo "BUILDING NEXARACE RELEASE APK"
          echo "========================================"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Starting Gradle assembleRelease..."
          echo ""

          set +e

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "GRADLE EXIT CODE"
          echo "========================================"
          echo "$BUILD_EXIT"

          echo ""
          echo "========================================"
          echo "IMPORTANT ERROR LINES"
          echo "========================================"

          grep -E \
            "FAILURE:|What went wrong:|Execution failed for task|error:|Error:|Caused by:|AAPT2|Manifest merger failed|Duplicate|Could not resolve|Could not find|SDK|resource .* not found|uses-sdk|minSdk|targetSdk|compileSdk" \
            "$LOG_FILE" \
            | tail -n 150 || true

          echo ""
          echo "========================================"
          echo "LAST 100 LOG LINES"
          echo "========================================"

          tail -n 100 "$LOG_FILE"

          echo ""
          echo "========================================"
          echo "APK FILES FOUND"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print || true

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "APK BUILD FAILED"
            echo "========================================"
            exit "$BUILD_EXIT"
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"


    artifacts:
      - "**/build/outputs/apk/release/*.apk"
      - "$CM_BUILD_DIR/assemble-release.log"
