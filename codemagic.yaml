workflows:
  nexapay_android:
    name: NexaPay Android

    environment:
      node: 20
      java: 17

    scripts:
      - name: Build NexaPay Android
        script: |
          set -e

          echo "===== FIND ZIP ====="

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "NexaPay_DZ_CODEMAGIC_FIXED.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"

          echo "===== EXTRACT ZIP ====="

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          cd extracted

          echo "===== PROJECT ROOT ====="
          pwd
          ls -la

          echo "===== INSTALL CAPACITOR ====="

          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo "===== CAPACITOR VERSION ====="

          npx cap --version

          echo "===== CAPACITOR SYNC ====="

          npx cap sync android

          echo "===== ANDROID BUILD.GRADLE ====="

          echo "----- FIRST 30 LINES -----"

          nl -ba android/app/build.gradle | sed -n '1,30p'

          echo "----- END BUILD.GRADLE -----"

          echo "===== BUILD APK ====="

          cd android

          chmod +x gradlew

          ./gradlew assembleRelease

          echo "===== APK CREATED ====="

          find app/build/outputs -type f -name "*.apk" -print

    artifacts:
      - "extracted/android/app/build/outputs/**/*.apk"
