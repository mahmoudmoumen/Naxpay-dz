workflows:
  nexapay-android:
    name: Android App Bundle
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Install Dependencies
        script: |
          npm install

      - name: Build Web Assets and Sync
        script: |
          mkdir -p android/app/src/main/assets
          cp -R www/* android/app/src/main/assets/ || true
          npx cap sync android || true

      - name: Setup Gradle Wrapper and Build AAB
        script: |
          cd android
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew --stacktrace bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
