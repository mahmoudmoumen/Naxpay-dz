workflows:
  android-workflow:
    name: NexaPay DZ Android
    environment:
      vars:
        PACKAGE_DIR: extracted
      flutter: stable

    scripts:
      - name: Find project root
        script: |
          echo "=== Searching for package.json ==="
          find . -name package.json -type f
          
          if [ -f "extracted/package.json" ]; then
            cd extracted
          elif [ -f "package.json" ]; then
            echo "package.json already in root"
          else
            echo "ERROR: package.json not found anywhere"
            exit 1
          fi
          
          echo "Project directory:"
          pwd
          ls -la

      - name: Install dependencies
        script: |
          if [ -f "extracted/package.json" ]; then
            cd extracted
          fi
          
          npm install

      - name: Prepare Capacitor Android
        script: |
          if [ -f "extracted/package.json" ]; then
            cd extracted
          fi
          
          npx cap sync android

      - name: Build Android
        script: |
          if [ -f "extracted/package.json" ]; then
            cd extracted
          fi
          
          cd android
          ./gradlew assembleRelease

    artifacts:
      - extracted/android/app/build/outputs/**/*.apk
      - extracted/android/app/build/outputs/**/*.aab
