workflows:
  nexarace-release:
    name: NexaRace Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

      android_signing:
        - nexapay_release

    scripts:

      - name: Extract NexaRace
        script: |
          set -e

          ZIP_FILE="NexaRace_FINAL_ANDROID_CODMATIC_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found: $ZIP_FILE"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/extracted"
          mkdir -p "$CM_BUILD_DIR/extracted"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/extracted"

          echo "ZIP extracted successfully"

          find "$CM_BUILD_DIR/extracted" \
            -type f \
            \( -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print


      - name: Find Android Project
        script: |
          set -e

          GRADLEW=$(find "$CM_BUILD_DIR/extracted" \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found"
            find "$CM_BUILD_DIR/extracted" -maxdepth 10 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "$PROJECT_DIR" > "$CM_BUILD_DIR/project_dir.txt"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"


      - name: Configure Android SDK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          echo "Android SDK configured"


      - name: Check Android Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")
          cd "$PROJECT_DIR"

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          ./gradlew --version


      - name: Validate Gradle Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")
          cd "$PROJECT_DIR"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace


      - name: Clean Project
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")
          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      - name: Build Release APK
        script: |
          set -e

          PROJECT_DIR=$(cat "$CM_BUILD_DIR/project_dir.txt")
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING NEXARACE RELEASE APK"
          echo "========================================"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

          echo "========================================"
          echo "APK BUILD SUCCESS"
          echo "========================================"

          find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print


    artifacts:
      - "**/build/outputs/apk/release/*.apk"
